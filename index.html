<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lista de Compras</title>
<style>
  :root{
    --bg:#f4f2ee;
    --card:#ffffff;
    --accent:#2f6f4f;
    --accent-light:#e6f2ea;
    --text:#2b2b2b;
    --muted:#8a8a8a;
    --border:#e7e4de;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    padding:20px 12px 60px;
  }
  .wrap{max-width:520px;margin:0 auto;}
  header{margin-bottom:16px;}
  h1{font-size:1.4rem;margin:0 0 4px;}
  .sub{color:var(--muted);font-size:.9rem;}

  details.editor{
    background:var(--card);
    border-radius:14px;
    margin-bottom:16px;
    box-shadow:0 1px 3px rgba(0,0,0,.06);
    overflow:hidden;
  }
  details.editor summary{
    padding:12px 16px;
    font-weight:600;
    font-size:.9rem;
    cursor:pointer;
    list-style:none;
    display:flex;
    justify-content:space-between;
    align-items:center;
    transition:background .15s ease;
  }
  details.editor summary:hover{background:var(--accent-light);}
  details.editor summary::-webkit-details-marker{display:none;}
  details.editor[open] summary::after{content:"✕";color:var(--muted);font-weight:600;font-size:1rem;}
  .editor-body{padding:0 16px 16px;}
  .editor-hint{font-size:.78rem;color:var(--muted);margin:0 0 8px;line-height:1.4;}
  textarea{
    width:100%;
    min-height:160px;
    border:1px solid var(--border);
    border-radius:10px;
    padding:10px 12px;
    font-size:.9rem;
    font-family:inherit;
    resize:vertical;
    color:var(--text);
    background:#fcfcfb;
  }
  .editor-actions{display:flex;gap:8px;margin-top:10px;}
  .btn{
    border:none;
    border-radius:10px;
    padding:10px 16px;
    font-size:.88rem;
    cursor:pointer;
    transition:background .15s ease;
  }
  .btn-primary{background:var(--accent);color:#fff;}
  .btn-primary:hover{background:#285f43;}
  .btn-primary:active{background:#255c40;}
  .btn-secondary{background:var(--accent-light);color:var(--accent);}
  .btn-secondary:hover{background:#d9ebe1;}
  .btn-secondary:active{background:#cde3d6;}

  .progress-card{
    background:var(--card);
    border-radius:14px;
    padding:14px 16px;
    margin:16px 0;
    box-shadow:0 1px 3px rgba(0,0,0,.06);
  }
  .progress-top{display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted);margin-bottom:8px;}
  .bar-bg{background:var(--border);border-radius:20px;height:10px;overflow:hidden;}
  .bar-fill{background:var(--accent);height:100%;width:0%;transition:width .3s ease;}

  .category{
    background:var(--card);
    border-radius:14px;
    margin-bottom:14px;
    box-shadow:0 1px 3px rgba(0,0,0,.06);
    overflow:hidden;
  }
  .cat-header{
    padding:12px 16px;
    font-weight:600;
    font-size:.95rem;
    background:var(--accent-light);
    color:var(--accent);
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .cat-count{font-weight:400;font-size:.8rem;color:var(--accent);opacity:.8;}

  ul{list-style:none;margin:0;padding:0;}
  li{
    display:flex;
    align-items:flex-start;
    gap:10px;
    padding:11px 16px;
    border-top:1px solid var(--border);
    cursor:pointer;
    user-select:none;
  }
  li:active{background:#fafafa;}
  .box{
    flex-shrink:0;
    width:22px;height:22px;
    border-radius:6px;
    border:2px solid #c7c3ba;
    margin-top:1px;
    display:flex;align-items:center;justify-content:center;
    transition:all .15s ease;
  }
  .box svg{opacity:0;transform:scale(.5);transition:all .15s ease;width:14px;height:14px;}
  li.done .box{background:var(--accent);border-color:var(--accent);}
  li.done .box svg{opacity:1;transform:scale(1);}
  .label{font-size:.95rem;line-height:1.35;}
  li.done .label{color:var(--muted);text-decoration:line-through;}
  .note{display:block;font-size:.78rem;color:var(--muted);margin-top:2px;font-weight:400;}
  li.done .note{text-decoration:line-through;}

  .empty{color:var(--muted);font-size:.9rem;text-align:center;padding:24px 0;}

  .reset-btn{
    display:block;
    margin:24px auto 0;
    background:var(--card);
    border:1px solid var(--border);
    color:var(--text);
    padding:10px 18px;
    border-radius:10px;
    font-size:.9rem;
    cursor:pointer;
    transition:background .15s ease;
  }
  .reset-btn:hover{background:#f0f0f0;}
  .reset-btn:active{background:#e6e6e6;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🛒 Lista de Compras</h1>
    <div class="sub">Toque nos itens para marcar</div>
  </header>

  <details class="editor" id="editor">
    <summary><span>Editar lista</span></summary>
    <div class="editor-body">
      <p class="editor-hint">
        Uma linha por item, começando com "-". Linhas terminadas em ":" criam uma categoria.
        Texto entre parênteses vira uma observação. Exemplo:<br>
        <code>Hortifruti:<br>- Alface<br>- Laranja (se estiver barato)</code>
      </p>
      <textarea id="listInput" spellcheck="false"></textarea>
      <div class="editor-actions">
        <button class="btn btn-primary" id="generateBtn">Gerar lista</button>
        <button class="btn btn-secondary" id="clearBtn">Limpar</button>
      </div>
    </div>
  </details>

  <div class="progress-card">
    <div class="progress-top">
      <span id="progressText">0 de 0 itens</span>
      <span id="progressPct">0%</span>
    </div>
    <div class="bar-bg"><div class="bar-fill" id="barFill"></div></div>
  </div>

  <div id="list"></div>

  <button class="reset-btn" id="resetBtn">Desmarcar tudo</button>
</div>

<script>
const STORAGE_TEXT_KEY = 'listaCompras:texto';
const STORAGE_STATE_KEY = 'listaCompras:marcados';
const DEFAULT_LIST_TEXT = '';

const listEl = document.getElementById('list');
const listInput = document.getElementById('listInput');
const editor = document.getElementById('editor');
let state = {}; // id -> boolean

function parseListText(text) {
  const lines = text.split('\n');
  const groups = [];
  let current = null;

  lines.forEach(rawLine => {
    const line = rawLine.trim();
    if (!line) return;

    const isCategory = !line.startsWith('-') && !line.startsWith('•') && line.endsWith(':');
    if (isCategory) {
      current = { cat: line.slice(0, -1).trim(), items: [] };
      groups.push(current);
      return;
    }

    const itemText = line.replace(/^[-•]\s*/, '').trim();
    if (!itemText) return;

    if (!current) {
      current = { cat: 'Lista', items: [] };
      groups.push(current);
    }

    const noteMatch = itemText.match(/^(.*?)\s*\(([^)]+)\)\s*$/);
    if (noteMatch) {
      current.items.push(`${noteMatch[1].trim()}||${noteMatch[2].trim()}`);
    } else {
      current.items.push(itemText);
    }
  });

  return groups.filter(g => g.items.length > 0);
}

function render(data, preserveState) {
  const newState = {};
  listEl.innerHTML = '';
  let idCounter = 0;

  if (data.length === 0) {
    listEl.innerHTML = '<div class="empty">Nenhum item. Use "Editar lista" para adicionar itens.</div>';
    state = newState;
    updateProgress();
    return;
  }

  data.forEach(group => {
    const catDiv = document.createElement('div');
    catDiv.className = 'category';

    const header = document.createElement('div');
    header.className = 'cat-header';
    header.innerHTML = `<span>${group.cat}</span><span class="cat-count">0/${group.items.length}</span>`;
    catDiv.appendChild(header);

    const ul = document.createElement('ul');

    group.items.forEach(raw => {
      const [text, note] = raw.split('||');
      const id = 'item-' + (idCounter++);
      newState[id] = preserveState ? !!state[id] : false;

      const li = document.createElement('li');
      li.dataset.id = id;
      if (newState[id]) li.classList.add('done');

      li.innerHTML = `
        <div class="box">
          <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
        </div>
        <span class="label">${text}${note ? `<span class="note">${note}</span>` : ''}</span>
      `;

      li.addEventListener('click', () => toggleItem(id));
      ul.appendChild(li);
    });

    catDiv.appendChild(ul);
    listEl.appendChild(catDiv);
  });

  state = newState;
  updateProgress();
}

function toggleItem(id) {
  state[id] = !state[id];
  const li = document.querySelector(`li[data-id="${id}"]`);
  li.classList.toggle('done', state[id]);
  updateProgress();
  saveState();
}

function updateProgress() {
  const ids = Object.keys(state);
  const total = ids.length;
  const done = ids.filter(id => state[id]).length;
  document.getElementById('progressText').textContent = `${done} de ${total} itens`;
  document.getElementById('progressPct').textContent = total ? Math.round(done/total*100) + '%' : '0%';
  document.getElementById('barFill').style.width = (total ? done/total*100 : 0) + '%';

  document.querySelectorAll('.category').forEach(catDiv => {
    const countEl = catDiv.querySelector('.cat-count');
    const lis = catDiv.querySelectorAll('li');
    let d = 0;
    lis.forEach(li => { if (state[li.dataset.id]) d++; });
    countEl.textContent = `${d}/${lis.length}`;
  });
}

function saveText(text) {
  try { localStorage.setItem(STORAGE_TEXT_KEY, text); } catch (e) {}
}

function saveState() {
  try { localStorage.setItem(STORAGE_STATE_KEY, JSON.stringify(state)); } catch (e) {}
}

function loadSavedText() {
  try { return localStorage.getItem(STORAGE_TEXT_KEY); } catch (e) { return null; }
}

function loadSavedState() {
  try {
    const raw = localStorage.getItem(STORAGE_STATE_KEY);
    return raw ? JSON.parse(raw) : {};
  } catch (e) { return {}; }
}

document.getElementById('generateBtn').addEventListener('click', () => {
  const text = listInput.value;
  const data = parseListText(text);
  saveText(text);
  render(data, false);
  saveState();
  editor.open = false;
});

document.getElementById('clearBtn').addEventListener('click', () => {
  listInput.value = '';
  listInput.focus();
});

document.getElementById('resetBtn').addEventListener('click', () => {
  Object.keys(state).forEach(id => state[id] = false);
  document.querySelectorAll('li').forEach(li => li.classList.remove('done'));
  updateProgress();
  saveState();
});

const savedText = loadSavedText();
const initialText = savedText !== null ? savedText : DEFAULT_LIST_TEXT;
listInput.value = initialText;
if (savedText !== null) {
  state = loadSavedState();
  render(parseListText(initialText), true);
} else {
  render(parseListText(initialText), false);
}

if (!initialText.trim()) {
  editor.open = true;
}
</script>
</body>
</html>
